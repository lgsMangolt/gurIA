<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120"><rect width="1440" height="1120" fill="#f4f4f4"/><g font-family="Segoe UI,Arial,sans-serif"><text x="64" y="72" font-size="18" fill="#626262" letter-spacing="3">EXPLORAÇÕES DE IDENTIDADE / 01</text><text x="64" y="144" font-size="64" font-weight="700" letter-spacing="-3" fill="#252525">Um gur. Quatro jeitos de se apresentar.</text><text x="64" y="188" font-size="22" fill="#626262">gurIA · o nome é gur; a brincadeira está no IA.</text><rect x="64" y="236" width="640" height="366" rx="20" fill="#ffffff" stroke="#dddddd"/><text x="96" y="282" font-size="14" letter-spacing="2" fill="#626262">01 / LAÇO</text><g transform="translate(110 320)"><g transform="translate(22 22)" color="#555555"><g fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round"><path d="M49 33 38 22a19 19 0 0 0-27 27l14 14a19 19 0 0 0 27 0l10-10"/><path d="m43 63 11 11a19 19 0 0 0 27-27L67 33a19 19 0 0 0-27 0L30 43"/></g></g><text x="134" y="105" font-family="Segoe UI,Arial,sans-serif" font-size="90" font-weight="750" letter-spacing="-5" fill="#242424">gur<tspan fill="#555555">IA</tspan></text></g><text x="96" y="528" font-size="20" fill="#626262">Conexão entre ideias.</text><text x="96" y="558" font-size="20" fill="#626262">Símbolo abstrato, simples e versátil.</text><rect x="736" y="236" width="640" height="366" rx="20" fill="#ffffff" stroke="#dddddd"/><text x="768" y="282" font-size="14" letter-spacing="2" fill="#626262">02 / G DE GUR</text><g transform="translate(782 320)"><g transform="translate(22 22)" color="#5f5f5f"><g fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path d="M71 28v39c0 16-10 23-24 23-9 0-15-3-20-8"/><circle cx="46" cy="44" r="25"/><path d="m70 27 9-8"/></g></g><text x="134" y="105" font-family="Segoe UI,Arial,sans-serif" font-size="90" font-weight="750" letter-spacing="-5" fill="#242424">gur<tspan fill="#5f5f5f">IA</tspan></text></g><text x="768" y="528" font-size="20" fill="#626262">O g como caminho de aprendizagem.</text><text x="768" y="558" font-size="20" fill="#626262">Bom para ícone do app e avatar.</text><rect x="64" y="634" width="640" height="366" rx="20" fill="#ffffff" stroke="#dddddd"/><text x="96" y="680" font-size="14" letter-spacing="2" fill="#626262">03 / GUR, O COMPANHEIRO</text><g transform="translate(110 718)"><g transform="translate(22 22)" color="#626262"><path d="M18 19h56a15 15 0 0 1 15 15v29a15 15 0 0 1-15 15H49L28 94V78H18A15 15 0 0 1 3 63V34a15 15 0 0 1 15-15Z" fill="currentColor"/><g fill="#ffffff"><rect x="25" y="37" width="7" height="12" rx="3.5"/><rect x="60" y="37" width="7" height="12" rx="3.5"/></g><path d="M36 58q10 10 20 0" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/></g><text x="134" y="105" font-family="Segoe UI,Arial,sans-serif" font-size="90" font-weight="750" letter-spacing="-5" fill="#242424">gur<tspan fill="#626262">IA</tspan></text></g><text x="96" y="926" font-size="20" fill="#626262">Um gur com quem conversar.</text><text x="96" y="956" font-size="20" fill="#626262">A opção mais acolhedora e expressiva.</text><rect x="736" y="634" width="640" height="366" rx="20" fill="#ffffff" stroke="#dddddd"/><text x="768" y="680" font-size="14" letter-spacing="2" fill="#626262">04 / SÓ A PALAVRA</text><g transform="translate(782 718)"><text x="90" y="108" font-family="Segoe UI,Arial,sans-serif" font-size="106" font-weight="750" letter-spacing="-5" fill="#242424">gur<tspan fill="#5e5e5e">IA</tspan></text><path d="M95 122h145" stroke="#5e5e5e" stroke-width="5" stroke-linecap="round"/></g><text x="768" y="926" font-size="20" fill="#626262">O nome resolve a identidade.</text><text x="768" y="956" font-size="20" fill="#626262">Minimalista, direto e legível.</text><text x="64" y="1080" font-size="17" fill="#626262">Propostas vetoriais · fundo transparente nos arquivos individuais · escolha por número para refinar</text></g></svg>