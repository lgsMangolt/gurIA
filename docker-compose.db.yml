# Banco local da gurIA (PostgreSQL 16), só na interface de loopback.
#
# Cada instalação usa o próprio projeto do Compose, e com ele o próprio
# contêiner e volume de dados:
#   - instalação pessoal: projeto guria-db, porta 5440 (o padrão): `npm run db:up`,
#     scripts/start-study.ps1 e scripts/guria-desktop.mjs;
#   - demo isolada: projeto guria-readme-db, porta 5441 (scripts/readme-demo/up.mjs).
#
# Os nomes `openmaic` (banco, usuário e a chave do volume `openmaic-postgres`)
# vêm da versão anterior e não mudam: o volume real é `<projeto>_openmaic-postgres`,
# e trocar a chave criaria um volume novo e vazio.
name: guria-db

services:
  postgres:
    image: postgres:16
    environment:
      - POSTGRES_DB=openmaic
      - POSTGRES_USER=openmaic
      # Padrão de desenvolvimento. Só vale quando o volume está vazio (é aí que o
      # usuário é criado); use letras e números, ou um DATABASE_URL codificado.
      - POSTGRES_PASSWORD=${PERSISTENCE_POSTGRES_PASSWORD:-openmaic-dev}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U openmaic -d openmaic']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - openmaic-postgres:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:${OPENMAIC_DB_PORT:-5440}:5432'
    restart: unless-stopped

volumes:
  openmaic-postgres:
